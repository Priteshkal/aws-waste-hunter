[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "aws-waste-hunter"
version = "0.1.0"
description = "Read-only, auditable AWS waste scanner with dollar estimates."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Helyx IT", email = "pritesh@helyxit.com" }]
dependencies = ["boto3>=1.34,<2"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "moto[ec2,s3,logs,elbv2,ecr]>=5", "ruff>=0.6", "mypy>=1.11", "pip-audit>=2.7", "boto3-stubs[essential]>=1.34"]

[project.scripts]
aws-waste-hunter = "aws_waste_hunter.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/aws_waste_hunter"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]

[tool.mypy]
strict = true
python_version = "3.10"
